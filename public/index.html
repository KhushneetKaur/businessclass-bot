<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business Class Help</title>
<style>
  :root{--ink:#14213d;--paper:#f7f8fa;--accent:#0b6e4f;--me:#0b6e4f;--bot:#fff;--line:#dfe3ea}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;max-width:720px;margin:0 auto}
  header{padding:14px 16px;background:var(--ink);color:#fff}
  header h1{font-size:18px;margin:0}
  header p{margin:2px 0 0;font-size:13px;opacity:.8}
  #log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .m{max-width:85%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
  .bot{background:var(--bot);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
  .me{background:var(--me);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 8px}
  .chips button{border:1px solid var(--accent);background:#fff;color:var(--accent);padding:7px 12px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
  form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:#fff;padding-bottom:max(12px,env(safe-area-inset-bottom))}
  input{flex:1;font:inherit;padding:11px 14px;border:1px solid var(--line);border-radius:999px;min-width:0}
  form button{font:inherit;border:0;background:var(--accent);color:#fff;padding:0 20px;border-radius:999px;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
  button:disabled{opacity:.5}
</style>
</head>
<body>
<header><h1>Business Class Help</h1><p>Ask anything about the course. Answers come from the official FAQ.</p></header>
<div id="log" aria-live="polite">
  <div class="m bot">Hi! Ask me about enrollment, certificates, exams or app problems.</div>
</div>
<div class="chips" id="chips">
  <button>How do I get my certificate?</button>
  <button>How do I enroll?</button>
  <button>Exam schedule?</button>
</div>
<form id="f">
  <input id="q" placeholder="Type your question" autocomplete="off" maxlength="300" required>
  <button id="send">Send</button>
</form>
<script>
const log=document.getElementById("log"),f=document.getElementById("f"),q=document.getElementById("q"),send=document.getElementById("send"),chips=document.getElementById("chips");
function add(t,c){const d=document.createElement("div");d.className="m "+c;d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
async function ask(text){
  chips.remove&&chips.remove();
  add(text,"me");const wait=add("Thinking...","bot");send.disabled=true;
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:text})});
    if(!r.ok){wait.textContent=(await r.text())||"Something went wrong."}
    else if(r.body&&r.body.getReader){
      const rd=r.body.getReader(),dec=new TextDecoder();let out="";
      while(true){const{done,value}=await rd.read();if(done)break;out+=dec.decode(value,{stream:true});wait.textContent=out;log.scrollTop=log.scrollHeight}
      if(!out)wait.textContent="Something went wrong. Please try again."
    }else{wait.textContent=await r.text()}
  }catch(e){wait.textContent="No connection. Check your internet and try again."}
  send.disabled=false;log.scrollTop=log.scrollHeight;
}
f.addEventListener("submit",e=>{e.preventDefault();const t=q.value.trim();if(t){q.value="";ask(t)}});
chips.addEventListener("click",e=>{if(e.target.tagName==="BUTTON")ask(e.target.textContent)});
</script>
</body>
</html>
